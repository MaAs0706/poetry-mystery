<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Things Kept in the Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="progress"></div>
  <nav>
    <a class="nav-title" href="#top">things kept in the dark</a>
    <div class="nav-links"><a href="#poems">poems</a><button id="openEditor">write</button></div>
  </nav>
  <main id="top">
    <section class="cover">
      <div class="cover-circle"></div>
      <p class="eyebrow">a personal collection</p>
      <h1>Things I could not<br><i>say in daylight</i></h1>
      <div class="rule"></div>
      <p class="author">by her name</p>
      <a class="scroll" href="#poems"><span>begin reading</span><b></b></a>
    </section>
    <section class="contents" id="poems">
      <p class="eyebrow">the collection</p>
      <div class="contents-top"><h2>Poems</h2><button id="openEditorList">+ add a poem</button></div>
      <ol id="contentsList"></ol>
    </section>
    <section class="writing" id="writing"></section>
  </main>
  <footer><span>© 2026</span><span>made with quiet hands</span></footer>
  <dialog id="poemDialog">
    <form method="dialog" id="poemForm">
      <div class="dialog-head"><p class="eyebrow">a new poem</p><button value="cancel" aria-label="Close">×</button></div>
      <label>Title<input required name="title" placeholder="Give it a name" maxlength="70" /></label>
      <label>Poem<textarea required name="body" rows="10" placeholder="Write here..."></textarea></label>
      <button class="publish" type="submit">Add to collection</button>
      <small>Saved in this browser.</small>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
